[project]
name = "ops-agent-runtime"
version = "0.1.0"
description = "基于 LangGraph 的银行运营 Agent 任务执行运行时：审批、幂等、对账与审计"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# 项目名是 ops-agent-runtime，但 Python 导入包名固定为 ops_agent
[tool.uv.build-backend]
module-name = "ops_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
